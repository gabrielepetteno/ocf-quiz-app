        <h1 style="font-size: 1.5rem; margin: 0 0 8px">
          OCF Quiz · Simulatore Esame Consulenti Finanziari
        </h1>
        <p>
          Per usare il simulatore dell'esame <strong>OCF</strong> (Albo unico
          dei Consulenti Finanziari) devi abilitare
          <strong>JavaScript</strong> nel browser. L'app è gratuita, open
          source, non richiede registrazione e funziona interamente nel tuo
          dispositivo.
        </p>
        <p>
          <strong>Cos'è l'esame OCF.</strong> È la prova valutativa, della
          durata di <strong>85 minuti</strong> con <strong>60 domande</strong> a
          risposta multipla, per l'iscrizione all'Albo unico dei Consulenti
          Finanziari. La soglia di superamento è <strong>80/100</strong>. Le
          domande sono distribuite su 5 macro-aree: diritto del mercato
          finanziario e intermediari (24), matematica finanziaria ed economia
          (19), diritto tributario (6), diritto previdenziale e assicurativo
          (6), diritto privato e commerciale (5).
        </p>
        <p>

    <!-- GitHub Pages SPA redirect: rispristina il path salvato da 404.html -->
    <script>
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf("?/") === 1) {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded.slice(1) + l.hash,
          );
        }
      })();
