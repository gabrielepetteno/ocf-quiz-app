<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="OCF Quiz — Simulatore Esame Consulenti Finanziari">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Top-left logo -->
  <g transform="translate(72, 72)">
    <rect width="80" height="80" rx="18" fill="#ffffff"/>
    <path d="M22 42 l13 13 l25 -27" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="180" y="128" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="600">OCF Quiz</text>

  <!-- Headline -->
  <text x="72" y="270" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-1">Simulatore esame OCF</text>
  <text x="72" y="350" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#bfdbfe">Consulenti Finanziari · gratis &amp; open source</text>

  <!-- Stats cards -->
  <g font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <g transform="translate(72, 420)">
      <rect width="240" height="140" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="24" y="62" font-size="56" font-weight="800">60</text>
      <text x="24" y="100" font-size="22" fill="#bfdbfe">domande</text>
    </g>
    <g transform="translate(336, 420)">
      <rect width="240" height="140" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="24" y="62" font-size="56" font-weight="800">85'</text>
      <text x="24" y="100" font-size="22" fill="#bfdbfe">minuti</text>
    </g>
    <g transform="translate(600, 420)">
      <rect width="240" height="140" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="24" y="62" font-size="56" font-weight="800">80/100</text>
      <text x="24" y="100" font-size="22" fill="#bfdbfe">soglia</text>
    </g>
    <g transform="translate(864, 420)">
      <rect width="264" height="140" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="24" y="62" font-size="56" font-weight="800">4.900+</text>
      <text x="24" y="100" font-size="22" fill="#bfdbfe">quesiti ufficiali</text>
    </g>
  </g>

  <!-- Bottom-right URL -->
  <text x="1128" y="600" text-anchor="end" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#bfdbfe">gabrielepetteno.github.io/ocf-quiz-app</text>
</svg>
